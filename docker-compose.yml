# nuntius
#
# The bot on its own needs nothing but an outbound connection to Discord and an
# inbound path from GitHub. The Docker watching is optional and brings a second
# container with it; it only starts under the `docker-watch` profile:
#
#   docker compose up -d                          # bot only
#   docker compose --profile docker-watch up -d   # bot + socket proxy

services:
  nuntius:
    build: .
    container_name: nuntius
    restart: unless-stopped
    # Matching the owner of ./data on the host. The image has its own non-root
    # user, but a bind mount keeps the host's ownership and shadows whatever the
    # image set up — so the container has to run as somebody who can write
    # there. Doing it this way, rather than chowning ./data to the image's uid,
    # keeps the mapping files readable and backup-able as your own user.
    #
    # Change this if you run as a different uid: `id -u`, `id -g`.
    user: "1000:1000"
    env_file: [.env]
    environment:
      # Only reached when the socket proxy is running; harmless otherwise,
      # because the Docker cog does not load without WATCH_CONTAINER.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # The mermaid renderer below. Unset this and ```mermaid fences arrive in
      # Discord as source, which is what happened before the renderer existed.
      - MERMAID_URL=http://mermaid:3000
    depends_on:
      mermaid:
        # Not required: a renderer that is not up yet only means a diagram
        # arrives as source, which is the documented fallback. Waiting keeps the
        # first few minutes after a deploy from looking like a regression.
        condition: service_healthy
    volumes:
      # The two JSON mapping files. Losing this is losing the link between every
      # Discord thread and its GitHub issue.
      - ./data:/app/data
    ports:
      # Put a reverse proxy in front and give GitHub the public URL. This is not
      # HTTPS on its own, and GitHub will not deliver webhooks to plain HTTP on
      # a public host.
      - "127.0.0.1:8091:8080"
    networks: [nuntius-net, mermaid-net]

  # ──────────────────────────────────────────────────────────────
  # Mermaid rendering.
  #
  # Discord cannot render a ```mermaid fence and never will, so diagrams have to
  # arrive as pictures. Drawing one means running mermaid.js, which means a
  # browser — hence a whole container for what looks like a formatting concern.
  #
  # Self-hosted rather than the public mermaid.ink or kroki.io because the
  # diagrams in a private repository *are* its architecture, and pointing this
  # at a public renderer hands over every one of them.
  # ──────────────────────────────────────────────────────────────
  mermaid:
    image: ghcr.io/jihchi/mermaid.ink:latest
    container_name: nuntius-mermaid
    restart: unless-stopped
    environment:
      # Chromium's own sandbox needs unprivileged user namespaces, which Ubuntu
      # 23.10 and later deny through AppArmor. Without this the browser aborts
      # on start-up with "No usable sandbox!" and the container never listens.
      # The image reads CI to pass --no-sandbox.
      #
      # What replaces that sandbox is below: this container holds no secrets, is
      # on a network with no route out, and cannot gain privileges. It is also
      # not published — only nuntius can reach it.
      - CI=1
    # Chromium maps its shared memory here, and Docker's 64 MB default is where
    # renders begin failing intermittently rather than outright.
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    # Rendering a trivial diagram, because the port answers several seconds
    # before the browser behind it can actually draw anything. `docker compose
    # ps` then tells you whether diagrams will work, rather than only whether a
    # process is alive.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/img/Zmxvd2NoYXJ0IExSCiAgQSAtLT4gQg==?type=png"]
      interval: 30s
      timeout: 10s
      start_period: 40s
    networks: [mermaid-net]

  # ──────────────────────────────────────────────────────────────
  # Docker access, when the Docker cog is in use.
  #
  # The bot never touches /var/run/docker.sock. It talks to this proxy, which
  # is allowed GET /containers/* and nothing else — enough for logs and
  # inspect, not enough to start, stop, exec, or run a privileged container.
  # That severs "bot RCE → host root".
  #
  # The restart button needs POST=1 *and* ALLOW_RESTART=1. Turning both on
  # re-opens that path; it is off by default on purpose.
  # ──────────────────────────────────────────────────────────────
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.4.1
    container_name: nuntius-socket-proxy
    profiles: [docker-watch]
    restart: unless-stopped
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp # haproxy writes its config here
    security_opt:
      - no-new-privileges:true
    networks: [nuntius-net]

networks:
  nuntius-net:
    driver: bridge

  # No route off the host. The renderer needs nothing from the internet — the
  # mermaid library is baked into the image — and a browser engine parsing text
  # that anyone with repository access can write is the one thing here worth
  # penning in.
  mermaid-net:
    driver: bridge
    internal: true
